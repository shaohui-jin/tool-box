# 发布两个包到 npm。
#
# 顺序：utils-lib → comp-lib。comp-lib 依赖 utils-lib，用 needs 保证先后，
# 也避免在 comp-lib job 里额外轮询等待。
#
# 判据：远程尚无 <pkg>-v{version} tag 才发布。tag 一律在**发布成功后**才打，
# 代表「已发布」而不是「试过了」，任何一步失败都能原样重试，不浪费版本号。
#
# ────────────────────────────────────────────────────────────────
# 当前状态：**自动触发被刻意关掉**。
#   push 触发分支整块注释，只保留 workflow_dispatch（手动跑）。
#   确认发布流程无误后，把 on.push 那两行的注释去掉即可。
# ────────────────────────────────────────────────────────────────
#
# Secret：NPM_TOKEN（npm Automation token，需具备两个 scope 的发布权限）
name: Release

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  #     - main

jobs:
  release-utils-lib:
    name: Release utils-lib
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.gate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release utils-lib
        id: gate
        run: |
          PKG="packages/utils-lib/package.json"
          VERSION="$(jq -r .version "$PKG")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          TAG="utils-lib-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过 utils-lib。要发新版请提高 ${PKG} 的 version。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始发布 utils-lib。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test and build utils-lib
        if: steps.gate.outputs.should_release == 'true'
        run: |
          pnpm --filter @shaohui_jin/utils-lib run typecheck
          pnpm --filter @shaohui_jin/utils-lib run test
          pnpm --filter @shaohui_jin/utils-lib run build

      - name: Publish utils-lib to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/utils-lib
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          pnpm publish --no-git-checks
          echo "已发布 @shaohui_jin/utils-lib@${{ steps.gate.outputs.version }}"

      - name: Create and push utils-lib tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"

  release-comp-lib:
    name: Release comp-lib
    needs: release-utils-lib
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release comp-lib
        id: gate
        run: |
          PKG="packages/comp-lib/package.json"
          VERSION="$(jq -r .version "$PKG")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          TAG="comp-lib-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过 comp-lib。要发新版请提高 ${PKG} 的 version。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始发布 comp-lib。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      # comp-lib 通过 workspace 依赖引用 utils-lib，而 utils-lib 的 exports 指向 dist，
      # 全新 checkout 后 dist 不存在，必须先构建，否则 typecheck 会报 TS2307。
      - name: Build utils-lib (for comp-lib deps)
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/utils-lib run build

      - name: Typecheck and build comp-lib
        if: steps.gate.outputs.should_release == 'true'
        run: |
          pnpm --filter @shaohui_jin/comp-lib run typecheck
          pnpm --filter @shaohui_jin/comp-lib run build

      - name: Publish comp-lib to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/comp-lib
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          pnpm publish --no-git-checks
          echo "已发布 @shaohui_jin/comp-lib@${{ steps.gate.outputs.version }}"

      - name: Create and push comp-lib tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"
